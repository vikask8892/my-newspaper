name: Daily Newspaper

on:
  schedule:
    # Runs at 02:30 UTC daily, which is 08:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows you to manually trigger it to test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run Newspaper Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python newspaper.py
