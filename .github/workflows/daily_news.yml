name: Daily Newspaper

on:
  schedule:
    # 3:00 UTC is 8:30 AM IST. GitHub can be delayed by 10-30 mins sometimes.
    - cron: '30 3 * * *'
  workflow_dispatch:
    # This line is what gives you the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run newspaper script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python newspaper.py
